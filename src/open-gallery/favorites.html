<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" />
    <meta name="description" content="Your saved artworks in Open Gallery." />
    <title>Saved Works — Open Gallery</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./favorites-page.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="./index.html" aria-label="Open Gallery home"><span class="mark" aria-hidden="true">◉</span> open gallery</a>
      <nav aria-label="Main navigation"><a href="./index.html#search">Explore</a><a href="./favorites.html" aria-current="page">Saved works <span id="favorite-count">0</span></a></nav>
    </header>
    <main class="saved-page">
      <section aria-labelledby="saved-title">
        <p class="eyebrow">Your collection</p>
        <h1 id="saved-title">Works worth keeping.</h1>
        <p class="saved-intro">Artworks you save on this device will be here when you come back.</p>
        <p id="saved-status" class="status" role="status" aria-live="polite"></p>
        <div class="saved-toolbar"><p id="saved-count"></p><button id="clear-saved" type="button" hidden>Clear saved works</button></div>
        <div id="favorites-grid" class="art-grid" aria-label="Saved artworks"></div>
        <div id="favorites-empty" class="favorites-empty" hidden><p>No saved works yet.</p><a class="text-link" href="./index.html#search">Explore the collection <span aria-hidden="true">→</span></a></div>
      </section>
    </main>
    <footer><a class="wordmark" href="./index.html"><span class="mark" aria-hidden="true">◉</span> open gallery</a><p>Saved works stay on this device.</p><a href="#top">Back to top ↑</a></footer>
  </body>
</html>
